name: Update repository

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScottyWins
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Pull PrimeScene and SmoothFlix main
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/AgreeWithScotty/PrimeScene.git .sources/PrimeScene
          git -C .sources/PrimeScene sparse-checkout set --no-cone /addons.xml
          git clone --depth 1 --filter=blob:none https://github.com/AgreeWithScotty/SmoothFlix.git .sources/SmoothFlix

      - name: Rebuild the repository index
        run: |
          if [ ! -f tools/build_repo.py ]; then
            echo "Builder is not on this branch yet."
            exit 0
          fi
          python3 tools/build_repo.py --primescene .sources/PrimeScene --smoothflix .sources/SmoothFlix

      - name: Commit new add-on versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No add-on changes."
            exit 0
          fi
          git commit -m "Update repository index from PrimeScene and SmoothFlix."
          git push
