name: Update repository

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  # git push of the rebuilt indexes, and GitHub Release asset uploads
  contents: write

concurrency:
  group: update-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScottyWins
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Pull PrimeScene release and SmoothFlix main
        run: |
          # Missing release fails this step. The job then does not commit, so
          # the published public files stay as they are. Do not fall back to main.
          git clone --depth 1 --branch release --filter=blob:none --sparse https://github.com/AgreeWithScotty/PrimeScene.git .sources/PrimeScene
          git -C .sources/PrimeScene sparse-checkout set --no-cone /addons.xml
          git clone --depth 1 --filter=blob:none https://github.com/AgreeWithScotty/SmoothFlix.git .sources/SmoothFlix

      - name: Pull PrimeScene testing
        id: testing
        run: |
          if git ls-remote --exit-code --heads https://github.com/AgreeWithScotty/PrimeScene.git testing >/dev/null; then
            git clone --depth 1 --branch testing --filter=blob:none --sparse https://github.com/AgreeWithScotty/PrimeScene.git .sources/PrimeScene-testing
            git -C .sources/PrimeScene-testing sparse-checkout set --no-cone /addons.xml
            echo "source=.sources/PrimeScene-testing" >> "$GITHUB_OUTPUT"
          else
            echo "PrimeScene testing branch does not exist; falling back to main for the test channel."
            git clone --depth 1 --branch main --filter=blob:none --sparse https://github.com/AgreeWithScotty/PrimeScene.git .sources/PrimeScene-testing
            git -C .sources/PrimeScene-testing sparse-checkout set --no-cone /addons.xml
            echo "source=.sources/PrimeScene-testing" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the repository index
        run: |
          if [ ! -f tools/build_repo.py ]; then
            echo "Builder is not on this branch yet."
            exit 0
          fi
          python3 tools/build_repo.py \
            --primescene .sources/PrimeScene \
            --smoothflix .sources/SmoothFlix \
            --testing-primescene "${{ steps.testing.outputs.source }}"

      # Upload even when the commit below has nothing new. An asset that is
      # already present is left alone so its download_count is kept.
      - name: Publish testing zips as GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/publish_test_releases.py

      - name: Commit new add-on versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No add-on changes."
            exit 0
          fi
          git commit -m "Update public and testing repository indexes."
          git push
